[project]
name = "push-to-talk"
version = "1.0.0"
description = "A Terminal User Interface (TUI) client for the Smart Device Gateway."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "av>=16.1.0",
    "ffmpeg>=1.4",
    "numpy>=2.3.5",
    "openai[realtime]>=2.8.1",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "sounddevice>=0.5.5",
    "textual>=7.5.0",
    "typing-extensions>=4.15.0",
]
